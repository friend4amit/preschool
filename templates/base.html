{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Aaroham{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Aaroham — a preschool built on play, rhythm and care.{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">

    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>

    {% block extra_head %}{% endblock %}
  </head>

  <body class="flex min-h-full flex-col antialiased {% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>

    {% block header %}{% endblock %}

    <main id="main" tabindex="-1"
          class="{% block main_class %}mx-auto w-full max-w-2xl px-5 py-10 md:px-8 md:py-14{% endblock %}">
      {% block content %}{% endblock %}
    </main>

    {% block footer %}{% endblock %}
    {% block extra_body %}{% endblock %}
  </body>
</html>
